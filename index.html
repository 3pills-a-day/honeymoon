<body>

<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <h1>신혼여행 지도</h1>
        <p class="tnum" id="subtitle"></p>
      </div>
      <button class="newbadge" id="newbadge" hidden></button>
      <nav class="tabs" role="tablist" aria-label="화면">
        <button class="tab" role="tab" id="tab-map" aria-selected="true" data-view="map">지도</button>
        <button class="tab" role="tab" id="tab-info" aria-selected="false" data-view="info">정보</button>
      </nav>
    </div>
    <div class="daybar" id="daybar" aria-label="일차 선택"></div>
  </header>
  <main>
    <section class="view" id="view-map" aria-label="지도">
      <div id="map"></div>
      <button class="lg-open" id="lg-open" aria-expanded="false" aria-controls="legend"><span id="lg-open-ic"></span>범례·필터</button>
      <div class="legend" id="legend">
        <div class="legend-head"><span>범례·필터</span><button id="lg-close" aria-label="범례 닫기"></button></div>
        <div class="legend-body">
          <div class="lg-types" id="lg-types"></div>
          <div class="lg-rule"></div>
          <div class="lg-key" id="lg-key"></div>
          <div class="lg-rule"></div>
          <label class="switch" for="show-cand"><span>후보 보기</span><input type="checkbox" id="show-cand" checked></label>
        </div>
      </div>
      <div class="card" id="card" hidden role="button" tabindex="0"></div>
      <button class="ptab" id="ptab" aria-label="일정 목록 숨기기" title="일정 목록 숨기기"></button>
      <aside class="panel" id="panel" data-state="peek" aria-label="일정 목록">
        <div class="ph" id="ph"><span class="grip"></span><button class="back" id="back" hidden aria-label="목록으로"></button><h2 id="ptitle">전체 일정</h2><span class="cnt tnum" id="pcnt"></span></div>
        <div class="pbody" id="pbody"></div>
      </aside>
      <button class="fab" id="fab"><span id="fab-ic"></span>PA에게 부탁</button>
      <div class="pickbar" id="pickbar" hidden><span id="picktxt">지도를 눌러 위치를 고르세요</span><button id="pickcancel">취소</button></div>
    </section>
    <section class="view" id="view-info" hidden aria-label="정보">
      <div class="info">
        <div class="info-head">
          <div><h2>정보</h2><p>요소를 추가하고 고치는 곳입니다. 저장하면 두 사람 화면에 바로 반영됩니다.</p><p class="who" id="who"></p></div>
          <button class="btn" id="add"><span id="add-ic"></span>추가</button>
        </div>
        <p class="settings" id="rate"></p>
        <div class="ftabs" id="ftabs"></div>
        <table class="tbl"><thead><tr><th>종류</th><th>이름</th><th>상태</th><th>날짜</th><th>비용</th><th>지불·예약</th></tr></thead><tbody id="tbody"></tbody></table>
      </div>
      <div class="drawer" id="drawer" hidden>
        <div class="ph"><h2 id="dtitle">요소 추가</h2><button class="back" id="dclose" aria-label="닫기"></button></div>
        <form id="form" novalidate></form>
        <div class="dfoot"><button class="btn danger" type="button" id="fdelete" hidden>삭제</button><span class="grow"></span><button class="btn ghost" type="button" id="fcancel">취소</button><button class="btn" type="submit" form="form" id="fsave">저장</button></div>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="undo" id="undo" hidden><span id="undotxt"></span><button type="button" id="undobtn">되돌리기</button></div>
<section class="overlay" id="composer" hidden aria-label="PA에게 부탁">
  <div class="ph"><h2>PA에게 부탁</h2><button class="back" id="cclose" aria-label="닫기"></button></div>
  <div class="obody">
    <p class="wstat" id="wstatus"></p>
    <p class="ctarget" id="ctarget" hidden></p>
    <label class="lb" for="ctext">무엇을 넣을까요? 캡처·링크·예약 확인서 PDF도 됩니다</label>
    <textarea id="ctext" maxlength="4000" placeholder="예: 바르셀로나 둘째 날 저녁에 갈 타파스 집 / 구글맵 링크 붙여넣기"></textarea>
    <div class="cattach"><button type="button" class="btn ghost" id="cadd"><span id="cadd-ic"></span>사진·PDF 추가</button><span class="hint" id="chint">4개까지 · PDF는 700KB까지</span>
      <input type="file" id="cfiles" accept="image/*,application/pdf" multiple hidden></div>
    <div class="cprev" id="cprev"></div>
    <div class="csend"><button type="button" class="btn" id="csend">보내기</button><button type="button" class="linkbtn" id="cmanual">직접 입력하기</button></div>
    <h3 class="rqh">보낸 부탁</h3>
    <div id="reqlist"></div>
  </div>
</section>
<section class="overlay" id="review" hidden aria-label="새 후보 확인">
  <div class="ph"><h2 id="rvtitle">새 후보 확인</h2><button class="back" id="rvclose" aria-label="닫기"></button></div>
  <div class="obody" id="rvbody"></div>
</section>
<div class="gate" id="gate">
  <div class="gate-box">
    <h1>신혼여행 지도</h1>
    <p id="gate-msg">불러오는 중입니다.</p>
    <button class="btn" id="login" hidden>Google로 로그인</button>
    <button class="btn ghost" id="relogin" hidden>다른 계정으로 로그인</button>
  </div>
</div>

const hoverable = matchMedia('(hover: hover) and (pointer: fine)').matches;
const wideMQ = matchMedia('(min-width: 672px)');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u || '')) ? u : null;
const svg = (n, size=16) => `<svg viewBox="0 0 32 32" width="${size}" height="${size}" fill="currentColor" aria-hidden="true">${ICON[n] || ''}</svg>`;
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function d2(s){ const [y,m,d] = s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); }
function wday(s){ return d2(s).getUTCDay(); }
function md(s){ const d = d2(s); return `${d.getUTCMonth()+1}/${d.getUTCDate()}(${WD[d.getUTCDay()]})`; }
function addDays(s,n){ const d = d2(s); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function nights(a,b){ return Math.round((d2(b)-d2(a))/86400000); }

function iconOf(it){ if(it.type==='move') return MODES[it.mode]?.icon || 'plane'; if(it.type==='hype') return (HYPE_SUB[it.sub]||HYPE_SUB.etc).icon; return TYPES[it.type].icon; }
function typeLabel(it){ if(it.type==='move') return `이동 · ${MODES[it.mode]?.label || ''}`; if(it.type==='hype') return `Hype · ${(HYPE_SUB[it.sub]||HYPE_SUB.etc).label}`; return TYPES[it.type].label; }
function conflict(it){ return !!(it.date && it.closed && it.closed.includes(wday(it.date))); }
function closedNote(it){ return it.closed && it.closed.length ? `${it.closed.map(i => WD[i]).join('·')}요일 휴무` : ''; }
function won(n){ return `${Math.round(n).toLocaleString('ko-KR')}원`; }
function costText(c, short){
  if(!c || c.amt == null) return '비용 없음';
  const per = c.per==='person' ? '1인' : '2인 합계';
  if(c.cur==='KRW'){ const s = `${per} ${won(c.amt)}`; return short || c.per!=='person' ? s : `${s} · 2인 ${won(c.amt*2)}`; }
  const eur = `€${Number(c.amt).toLocaleString('en-US')}`;
  return short ? `${per} ${eur}` : `${per} ${eur} (약 ${won(c.amt*(trip?.eurKrw || 1500))})`;
}
function tagsHtml(it){
  let h = '';
  if(it.pay && PAY[it.pay]) h += `<span class="tag ${PAY[it.pay][1]}">${PAY[it.pay][0]}</span>`;
  if(it.resv && RESV[it.resv]) h += `<span class="tag ${RESV[it.resv][1]}">${RESV[it.resv][0]}</span>`;
  return h ? `<div class="tags">${h}</div>` : '';
}
function when(it){
  if(it.type==='stay') return it.date && it.end ? `${md(it.date)} – ${md(it.end)} · ${nights(it.date,it.end)}박` : '날짜 미정';
  if(!it.date) return '날짜 미정';
  return `${md(it.date)}${it.time ? ' '+esc(it.time) : ''}${it.timeEnd ? '–'+esc(it.timeEnd) : ''}`;
}
function dotHtml(it, small){
  const cand = it.status==='candidate' ? ' cand' : '';
  return `<span class="dot${cand}" style="--c:var(${TYPES[it.type].c})">${svg(iconOf(it), small?12:16)}</span>`;
}
function warnHtml(it){ return conflict(it) ? `<div class="warnline">${svg('warning--alt')}<span>${closedNote(it)} — ${md(it.date)}에 배정됨</span></div>` : ''; }

/* 필터 */
function inFilter(it){
  if(!TYPES[it.type] || !state.types.has(it.type)) return false;
  if(!state.showCand && it.status==='candidate') return false;
  const f = state.filter;
  if(f.kind==='all') return true;
  if(f.kind==='city'){
    const c = CITIES.find(x => x.key===f.key); if(!c) return true;
    if(!it.date || it.type==='stay') return it.city===c.key;
    return it.date>=c.from && it.date<=c.to;
  }
  if(f.kind==='day'){
    if(!it.date) return false;
    if(it.type==='stay') return it.end ? (it.date<=f.day && f.day<it.end) : it.date===f.day;
    return it.date===f.day;
  }
  return true;
}
function visible(){ return ITEMS.filter(inFilter); }
function sortKey(it){ const t = it.type==='stay' ? '99:99' : (it.time||'00:00'); return `${it.date||'9999'} ${t}`; }

/* 일차 선택 줄 */
function renderDaybar(){
  const f = state.filter;
  let h = `<button class="chip" data-k="all" aria-pressed="${f.kind==='all'}">전체</button><span class="sep"></span>`;
  for(const c of CITIES) h += `<button class="chip" data-k="city" data-v="${esc(c.key)}" aria-pressed="${f.kind==='city'&&f.key===c.key}">${esc(c.label)}<small class="tnum">${md(c.from).replace(/\(.\)/,'')}–${md(c.to).replace(/\(.\)/,'')}</small></button>`;
  h += `<span class="sep"></span>`;
  DAYS.forEach((d,i) => { const dt = d2(d); h += `<button class="chip tnum" data-k="day" data-v="${d}" aria-pressed="${f.kind==='day'&&f.day===d}">D${i+1} ${dt.getUTCMonth()+1}/${dt.getUTCDate()}<span class="w">(${WD[dt.getUTCDay()]})</span></button>`; });
  $('#daybar').innerHTML = h;
}
$('#daybar').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if(!b) return;
  const k = b.dataset.k;
  state.filter = k==='all' ? {kind:'all'} : k==='city' ? {kind:'city', key:b.dataset.v} : {kind:'day', day:b.dataset.v};
  state.detail = null; hideSummary();
  renderAll(true);
  const nb = $(`#daybar .chip[data-k="${k}"]${b.dataset.v?`[data-v="${b.dataset.v}"]`:''}`); if(nb) nb.scrollIntoView({inline:'nearest', block:'nearest'});
});

/* 지도 */
let map = null, markers = {}, ready = false, tilesOk = true, firstLoad = true;
function arc(a, b, mode){
  if(mode!=='flight') return [a,b];
  const R = Math.PI/180, pts = [];
  const lon1=a[0]*R, lat1=a[1]*R, lon2=b[0]*R, lat2=b[1]*R;
  const dist = 2*Math.asin(Math.sqrt(Math.sin((lat2-lat1)/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin((lon2-lon1)/2)**2));
  if(dist > 0.3){
    for(let i=0;i<=64;i++){
      const f=i/64, A=Math.sin((1-f)*dist)/Math.sin(dist), B=Math.sin(f*dist)/Math.sin(dist);
      const x=A*Math.cos(lat1)*Math.cos(lon1)+B*Math.cos(lat2)*Math.cos(lon2);
      const y=A*Math.cos(lat1)*Math.sin(lon1)+B*Math.cos(lat2)*Math.sin(lon2);
      const z=A*Math.sin(lat1)+B*Math.sin(lat2);
      pts.push([Math.atan2(y,x)/R, Math.atan2(z,Math.sqrt(x*x+y*y))/R]);
    }
    return pts;
  }
  const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2, dx=b[0]-a[0], dy=b[1]-a[1];
  const cx=mx-dy*0.22, cy=my+dx*0.22;
  for(let i=0;i<=32;i++){ const t=i/32; pts.push([(1-t)**2*a[0]+2*(1-t)*t*cx+t*t*b[0], (1-t)**2*a[1]+2*(1-t)*t*cy+t*t*b[1]]); }
  return pts;
}
const mid = line => line[Math.floor(line.length/2)];
const isMoveOk = i => i.type==='move' && i.from?.lnglat && i.to?.lnglat;
function routesGeo(){
  return {type:'FeatureCollection', features: ITEMS.filter(isMoveOk).map(i => ({type:'Feature', properties:{id:i.id, status:i.status}, geometry:{type:'LineString', coordinates: arc(i.from.lnglat, i.to.lnglat, i.mode)}}))};
}
function mapColors(){ return {land:cssv('--map-land'), water:cssv('--map-water'), border:cssv('--map-border'), move:cssv('--c-move'), paper:cssv('--paper')}; }
const isDark = () => cssv('--map-water') === '#161616';
function fallbackStyle(){
  const c = mapColors();
  return {version:8, sources:{world:{type:'geojson', data:BASE.world, attribution:'Natural Earth'}, region:{type:'geojson', data:BASE.region}},
    layers:[
      {id:'bg', type:'background', paint:{'background-color':c.water}},
      {id:'world', type:'fill', source:'world', paint:{'fill-color':c.land}},
      {id:'region', type:'fill', source:'region', paint:{'fill-color':c.land}},
      {id:'borders', type:'line', source:'region', paint:{'line-color':c.border, 'line-width':1}}
    ]};
}
function styleFor(){ return tilesOk ? TILE_BASE + (isDark() ? 'dark' : 'positron') : fallbackStyle(); }
function addOverlay(){
  const c = mapColors();
  if(map.getSource('routes')) return;
  map.addSource('routes', {type:'geojson', data:routesGeo()});
  map.addLayer({id:'route-casing', type:'line', source:'routes', paint:{'line-color':c.paper, 'line-width':8}});
  map.addLayer({id:'route-conf', type:'line', source:'routes', filter:['==',['get','status'],'confirmed'], paint:{'line-color':c.move, 'line-width':4}});
  map.addLayer({id:'route-cand', type:'line', source:'routes', filter:['==',['get','status'],'candidate'], paint:{'line-color':c.move, 'line-width':4, 'line-dasharray':[2,1]}});
  map.addLayer({id:'route-hit', type:'line', source:'routes', paint:{'line-color':c.move, 'line-width':16, 'line-opacity':0}});
}
function initMap(){
  map = new maplibregl.Map({container:'map', attributionControl:false, dragRotate:false, pitchWithRotate:false, touchPitch:false, center:[0.5,44.5], zoom:4.6, minZoom:2, maxZoom:17, style:styleFor()});
  map.addControl(new maplibregl.NavigationControl({showCompass:false}), 'top-left');
  map.addControl(new maplibregl.AttributionControl({compact:true}), 'bottom-right');
  const fallbackTimer = setTimeout(() => { if(firstLoad){ tilesOk = false; map.setStyle(styleFor()); } }, 8000);
  map.on('error', e => { const m = String(e?.error?.message || e?.error?.url || ''); if(firstLoad && tilesOk && /openfreemap|styles/.test(m)){ tilesOk = false; map.setStyle(styleFor()); } });
  map.on('style.load', () => {
    addOverlay();
    if(firstLoad){ firstLoad = false; clearTimeout(fallbackTimer); ready = true; buildMarkers(); applyFilter(true); }
    else applyFilter(false);
    if(!tilesOk) toast('지도 서비스에 연결하지 못해 국경선 지도로 대신 보여 줍니다');
  });
  map.on('click', e => {
    if(state.pick){ finishPick([+e.lngLat.lng.toFixed(5), +e.lngLat.lat.toFixed(5)]); return; }
    const f = map.getLayer('route-hit') ? map.queryRenderedFeatures(e.point, {layers:['route-hit']})[0] : null;
    if(f){ touchItem(f.properties.id, e.lngLat); return; }
    const open = state.summary || state.detail || $('#panel').dataset.state !== 'peek';
    hideSummary();
    if(!wideMQ.matches && open){ state.detail = null; renderList(); setSheet('peek'); }
  });
  if(hoverable){
    map.on('mousemove','route-hit', e => { map.getCanvas().style.cursor='pointer'; const id=e.features[0].properties.id; if(state.summary!==id) showSummary(id, e.lngLat); });
    map.on('mouseleave','route-hit', () => { map.getCanvas().style.cursor=''; scheduleHide(); });
  }
  map.on('move', positionCard);
}
function refreshStyle(){ if(ready) map.setStyle(styleFor()); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTimeout(refreshStyle, 0));
new MutationObserver(() => setTimeout(refreshStyle, 0)).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

const CITY_LABELS = [['파리',[2.3522,48.8566]],['바르셀로나',[2.1734,41.3851]],['말라가',[-4.4214,36.7213]],['그라나다',[-3.5986,37.1773]],['마드리드',[-3.7038,40.4168]]];
let cityMarkers = [];
function buildMarkers(){
  if(!map) return;
  Object.values(markers).forEach(m => m.remove()); markers = {};
  cityMarkers.forEach(m => m.remove()); cityMarkers = [];
  if(!tilesOk) for(const [n,ll] of CITY_LABELS){ const el=document.createElement('div'); el.className='city'; el.textContent=n; cityMarkers.push(new maplibregl.Marker({element:el, anchor:'bottom', offset:[0,-14]}).setLngLat(ll).addTo(map)); }
  for(const it of ITEMS){
    if(!TYPES[it.type]) continue;
    if(it.type==='move' ? !isMoveOk(it) : !it.lnglat) continue;
    const el = document.createElement('button');
    el.className = 'mk'; el.dataset.id = it.id; el.setAttribute('aria-pressed','false');
    el.setAttribute('aria-label', `${typeLabel(it)} ${it.status==='confirmed'?'확정':'후보'}: ${it.name}`);
    const cand = it.status==='candidate' ? ' cand' : '';
    el.innerHTML = it.type==='move'
      ? `<span class="dot badge${cand}">${svg(iconOf(it))}</span>`
      : `<span class="dot${cand}" style="--c:var(${TYPES[it.type].c})">${svg(iconOf(it))}</span>${conflict(it)?`<span class="wbadge">${svg('warning--alt',12)}</span>`:''}<span class="num" hidden></span>`;
    const ll = it.type==='move' ? mid(arc(it.from.lnglat, it.to.lnglat, it.mode)) : it.lnglat;
    it._ll = ll;
    el.addEventListener('click', e => { e.stopPropagation(); if(state.pick) return; touchItem(it.id); });
    if(hoverable){ el.addEventListener('mouseenter', () => showSummary(it.id)); el.addEventListener('mouseleave', scheduleHide); }
    markers[it.id] = new maplibregl.Marker({element:el}).setLngLat(ll).addTo(map);
  }
}
function touchItem(id, ll){ if(hoverable || state.summary===id){ openDetail(id); return; } showSummary(id, ll); }
function applyFilter(fit){
  if(!ready) return;
  const vis = visible(), ids = new Set(vis.map(i => i.id));
  const ordered = state.filter.kind==='day' ? vis.filter(i => i.type!=='stay' && i.type!=='move').sort((a,b)=>sortKey(a).localeCompare(sortKey(b))) : [];
  for(const it of ITEMS){
    const m = markers[it.id]; if(!m) continue;
    const el = m.getElement();
    el.hidden = !ids.has(it.id);
    el.setAttribute('aria-pressed', String(state.detail===it.id || state.summary===it.id));
    const num = el.querySelector('.num');
    if(num){ const k = ordered.indexOf(it); num.hidden = k<0; num.textContent = k+1; }
  }
  if(map.getLayer('route-conf')){
    const lit = ['literal',[...ids]];
    map.setFilter('route-conf', ['all',['==',['get','status'],'confirmed'],['in',['get','id'],lit]]);
    map.setFilter('route-cand', ['all',['==',['get','status'],'candidate'],['in',['get','id'],lit]]);
    map.setFilter('route-casing', ['in',['get','id'],lit]);
    map.setFilter('route-hit', ['in',['get','id'],lit]);
  }
  if(fit) fitTo(vis);
}
function fitTo(vis){
  const pts = [];
  for(const it of vis){
    if(it.type==='move'){ if(isMoveOk(it)) for(const p of [it.from.lnglat, it.to.lnglat]) if(p[0] < 40) pts.push(p); }
    else if(it.lnglat) pts.push(it.lnglat);
  }
  if(!pts.length) return;
  const b = pts.reduce((acc,p) => [[Math.min(acc[0][0],p[0]),Math.min(acc[0][1],p[1])],[Math.max(acc[1][0],p[0]),Math.max(acc[1][1],p[1])]], [[180,90],[-180,-90]]);
  const wide = wideMQ.matches, pad = 56;
  map.fitBounds(b, {padding:{top:pad, left:pad, bottom: wide ? pad : 80+pad, right: wide ? panelW()+pad : pad}, maxZoom:14, duration:600});
}

/* 요약 팝업 */
let hideTimer = null, cardAnchor = null;
function scheduleHide(){ clearTimeout(hideTimer); hideTimer = setTimeout(() => { if(!$('#card').matches(':hover')) hideSummary(); }, 180); }
$('#card').addEventListener('mouseleave', () => { if(hoverable) scheduleHide(); });
$('#card').addEventListener('mouseenter', () => clearTimeout(hideTimer));
function showSummary(id, ll){
  clearTimeout(hideTimer);
  const it = ITEMS.find(i => i.id===id); if(!it) return;
  state.summary = id; cardAnchor = ll ? [ll.lng ?? ll[0], ll.lat ?? ll[1]] : it._ll;
  $('#card').innerHTML = `<div class="k">${dotHtml(it,true)}<span>${typeLabel(it)} · ${it.status==='confirmed'?'확정':'후보'}${it.code?` · <span class="mono">${esc(it.code)}</span>`:''}</span></div>
    <h3>${esc(it.name)}</h3>
    <div class="meta tnum">${when(it)}<br>${costText(it.cost, true)}</div>
    ${tagsHtml(it)}${warnHtml(it)}
    <button type="button" class="more">상세 보기</button>`;
  $('#card').hidden = false;
  positionCard(); markSelected();
}
function positionCard(){
  const card = $('#card'); if(card.hidden || !cardAnchor || !map) return;
  const wide = wideMQ.matches, p = map.project(cardAnchor);
  const W = $('#map').clientWidth - panelW(), H = $('#map').clientHeight - (wide ? 0 : $('#panel').offsetHeight);
  const cw = card.offsetWidth, ch = card.offsetHeight;
  let x, y;
  if(wide){ x = p.x + 20; y = p.y - ch/2; if(x + cw > W - 8) x = p.x - 20 - cw; }
  else { x = p.x - cw/2; y = p.y - ch - 28; if(y < 8) y = p.y + 28; }
  x = Math.max(8, Math.min(W - cw - 8, x)); y = Math.max(8, Math.min(H - ch - 8, y));
  card.style.left = x+'px'; card.style.top = y+'px';
}
function hideSummary(){ state.summary = null; $('#card').hidden = true; markSelected(); }
$('#card').addEventListener('click', () => { if(state.summary) openDetail(state.summary); });
$('#card').addEventListener('keydown', e => { if((e.key==='Enter'||e.key===' ') && state.summary){ e.preventDefault(); openDetail(state.summary); } });
function markSelected(){
  for(const [id,m] of Object.entries(markers)) m.getElement().setAttribute('aria-pressed', String(state.detail===id || state.summary===id));
  document.querySelectorAll('.row').forEach(r => r.setAttribute('aria-current', String(r.dataset.id===state.detail || r.dataset.id===state.summary)));
}

/* 목록·상세 */
function filterTitle(){
  const f = state.filter;
  if(f.kind==='all') return '전체 일정';
  if(f.kind==='city') return `${CITIES.find(c=>c.key===f.key)?.label || ''} 일정`;
  return `D${DAYS.indexOf(f.day)+1} · ${md(f.day)}`;
}
function rowHtml(it){
  const t = it.type==='stay' ? '숙소' : esc(it.time || '');
  return `<button class="row" data-id="${esc(it.id)}">${dotHtml(it)}<span class="t tnum">${t}</span>
    <span class="n"><b>${esc(it.name)}${conflict(it)?svg('warning--alt',12):''}</b><span>${typeLabel(it)} · ${it.status==='confirmed'?'확정':'후보'} · <span class="tnum">${costText(it.cost,true)}</span>${it.addedBy==='pa'?(it.reviewed===false?' · PA가 넣음(확인 전)':' · PA가 넣음'):''}</span>${tagsHtml(it)}</span></button>`;
}
function renderList(){
  const vis = visible().sort((a,b) => sortKey(a).localeCompare(sortKey(b)));
  $('#ptitle').textContent = filterTitle();
  $('#pcnt').textContent = `${vis.length}곳`;
  $('#back').hidden = true;
  if(!vis.length){ $('#pbody').innerHTML = `<p class="empty">이 조건에 맞는 요소가 없습니다. 다른 날을 고르거나, 정보 탭에서 요소를 추가하세요.</p>`; return; }
  const groups = new Map();
  for(const it of vis){
    let key;
    if(!it.date) key = '날짜 미정';
    else if(state.filter.kind==='day') key = it.type==='stay' ? '오늘 밤 숙소' : '일정';
    else key = DAYS.includes(it.date) ? `D${DAYS.indexOf(it.date)+1} · ${md(it.date)}` : md(it.date);
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(it);
  }
  let h = '';
  for(const [k, arr] of groups) h += `<div class="grp"><span class="tnum">${k}</span><span class="tnum">${arr.length}</span></div>` + arr.map(rowHtml).join('');
  $('#pbody').innerHTML = h;
  markSelected();
}
$('#pbody').addEventListener('click', e => { const r = e.target.closest('.row'); if(r) openDetail(r.dataset.id, true); });
if(hoverable){
  $('#pbody').addEventListener('mouseover', e => { const r = e.target.closest('.row'); if(!r) return; const m = markers[r.dataset.id]; if(m) m.getElement().setAttribute('aria-pressed','true'); });
  $('#pbody').addEventListener('mouseout', e => { if(e.target.closest('.row')) markSelected(); });
}
function fmtTs(ts){ try{ const d = ts.toDate(); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }catch(_){ return ''; } }
function openDetail(id, fly){
  if(wideMQ.matches && state.pclosed) setPanel(true);
  const it = ITEMS.find(i => i.id===id); if(!it){ state.detail = null; renderList(); return; }
  state.detail = id; hideSummary();
  const rows = [['일시', `<span class="tnum">${when(it)}</span>`]];
  if(it.type==='move' && it.from && it.to){
    rows.push(['구간', `${esc(it.from.name)} → ${esc(it.to.name)}`]);
    rows.push(['수단', `${MODES[it.mode]?.label || ''}${it.code?` · <span class="mono">${esc(it.code)}</span>`:''}${it.dur?` · ${esc(it.dur)}`:''}`]);
  }
  rows.push(['비용', `<span class="tnum">${costText(it.cost)}</span>${it.cost&&it.cost.note?`<br><span class="hint">${esc(it.cost.note)}</span>`:''}`]);
  const tg = tagsHtml(it);
  if(tg) rows.push(['상태', tg]);
  if(it.closed && it.closed.length) rows.push(['휴무', closedNote(it)]);
  if(it.memo) rows.push(['메모', esc(it.memo).replace(/\n/g,'<br>')]);
  let addr = '';
  if(it.addrEn || it.addrLocal){

(function sheetDrag(){

  ph.addEventListener('pointermove', e => { if(y0===null) return; const dy = y0 - e.clientY; if(Math.abs(dy) > 6) moved = true; if(moved){ $('#panel').style.transition='none'; $('#panel').style.height = Math.max(80, h0 + dy)+'px'; } });
  ph.addEventListener('pointerup', e => {
    if(y0===null) return; const p = $('#panel'); p.style.transition='';
    const H = $('#view-map').clientHeight, h = h0 + (y0 - e.clientY); y0 = null;
    if(!moved){ setSheet(p.dataset.state==='peek' ? 'fit' : 'peek'); return; }

let rateFetched = false;
async function syncRate(){
  if(rateFetched || !trip) return; rateFetched = true;
  try{
    const r = await fetch('https://api.frankfurter.dev/v1/latest?base=EUR&symbols=KRW');
    if(!r.ok) throw new Error(r.status);
    const j = await r.json(), v = Math.round(j?.rates?.KRW * 10) / 10;
    if(!(v > 0)) throw new Error('bad rate');
    if(v !== trip.eurKrw || j.date !== trip.eurKrwDate) await updateDoc(tripRef, {eurKrw:v, eurKrwDate:j.date});
  }catch(_){ rateFetched = false; }
}

  if(!trip) return '';

function readForm(){
  const f = new FormData($('#form')), d = draft;
  d.status = f.get('status'); d.type = f.get('type');
  if(f.has('mode')) d.mode = f.get('mode');
  if(f.has('sub')) d.sub = f.get('sub');
  d.city = f.get('city') || d.city;
  d.name = (f.get('name')||'').trim(); d.local = (f.get('local')||'').trim() || null;
  if(f.has('code')) d.code = (f.get('code')||'').trim() || null;
  if(f.has('dur')) d.dur = (f.get('dur')||'').trim() || null;
  d.date = f.get('date') || null;
  if(f.has('end')) d.end = f.get('end') || null;
  if(f.has('time')) d.time = f.get('time') || null;
  if(f.has('timeEnd')) d.timeEnd = (f.get('timeEnd')||'').trim() || null;
  const amt = parseFloat(f.get('amt'));
  d.cost = isNaN(amt) ? null : {...(d.cost||{}), amt, cur:f.get('cur'), per:f.get('per')};
  d.pay = f.get('pay') || null; d.resv = f.get('resv');
  if(d.type!=='move' && d.type!=='stay'){ const c = f.getAll('closed').map(Number); d.closed = c.length ? c : null; }
  d.addrEn = (f.get('addrEn')||'').trim() || null; d.addrLocal = (f.get('addrLocal')||'').trim() || null;
  d.links = (f.get('links')||'').split('\n').map(l => l.trim()).filter(Boolean).map(l => { const m = l.match(/(https?:\/\/\S+)/i); return m ? {t: l.replace(m[1],'').trim() || m[1], u: m[1]} : null; }).filter(Boolean);
  if(!d.links.length) d.links = null;
  d.memo = (f.get('memo')||'').trim() || null;
}

/* ===== 2단계: PA에게 부탁 · 새 후보 확인 · 빠른 버튼 (2단계-명세 §6) ===== */
const reqCol = collection(tripRef, 'requests');
const metaRef = doc(tripRef, 'meta', 'worker');
let REQS = [], WMETA = null, reqLoaded = false, pendingShare = null, sched = null, undoTimer = null, workerTimer = null;
const reqStatusSeen = new Map(), reqCache = new Map();
const comp = {target:null, retryOf:null, atts:[]};
const B64 = /^[A-Za-z0-9+/=]+$/;
const SLOTS = [['아침','09:00'],['점심','12:30'],['오후 간식','16:00'],['저녁','19:30'],['밤','22:00']];
const RSTAT = {queued:['대기','blue'], working:['처리 중','blue'], done:['완료','green'], question:['질문','warm'], failed:['실패','red'], cancelled:['취소','gray']};

const thumbImg = b => (typeof b === 'string' && b && b.length <= 30000 && B64.test(b)) ? `<img src="data:image/jpeg;base64,${b}" alt="">` : '';
const domainOf = u => { try{ return new URL(u).hostname.replace(/^www\./, ''); }catch(_){ return ''; } };
const needsReview = it => it.addedBy === 'pa' && it.reviewed === false;
const tsDate = t => t && typeof t.toDate === 'function' ? t.toDate() : null;
function hhmm(t){ const d = tsDate(t); return d ? `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` : ''; }

/* --- 구독 --- */
function startStage2(){
  unsubs.push(onSnapshot(query(reqCol, orderBy('createdAt', 'desc'), limit(20)), s => {
    REQS = s.docs.map(d => ({id:d.id, ...d.data()}));
    for(const r of REQS){
      reqCache.set(r.id, r);
      const prev = reqStatusSeen.get(r.id);
      if(reqLoaded && prev && prev !== r.status) notifyReq(r);
      reqStatusSeen.set(r.id, r.status);
    }
    reqLoaded = true;
    renderReqs(); renderWorker();
    if(!$('#review').hidden) renderReview();
  }, err => console.warn('requests', err.code)));
  unsubs.push(onSnapshot(metaRef, s => { WMETA = s.exists() ? s.data() : null; renderWorker(); }, () => {}));
  clearInterval(workerTimer);
  workerTimer = setInterval(renderWorker, 30000);
}

/* --- 작업기 상태 --- */
function workerState(){
  const seen = tsDate(WMETA && WMETA.lastSeen);
  if(!seen) return ['warn', 'PA 상태를 아직 몰라요 — 보내 두면 PA가 켜질 때 처리해요'];
  const age = (Date.now() - seen.getTime()) / 60000;
  if(age > 3) return ['warn', `PA 꺼짐(마지막 확인 ${Math.round(age)}분 전) — 켜지면 처리해요`];
  if(WMETA.state === 'limit') return ['warn', `PA가 바빠요 — ${hhmm(WMETA.nextTryAt) || '잠시 뒤'}쯤 다시 처리해요`];
  if(WMETA.state === 'auth') return ['warn', 'PA 로그인 만료 — 관리자 조치가 필요해요'];
  return ['ok', `PA 응답 가능 · ${age < 1 ? '방금' : Math.round(age) + '분 전'} 확인`];
}
function renderWorker(){
  const [cls, text] = workerState();
  const el = $('#wstatus');
  el.className = 'wstat ' + cls;
  el.innerHTML = '<span class="dotw"></span>';
  el.append(document.createTextNode(text));
}

/* --- 알림 --- */
function notifyReq(r){
  const res = r.result || {};
  if(r.status === 'done'){
    const names = (res.added || []).map(id => ITEMS.find(i => i.id === id)).filter(Boolean);
    const first = names[0] || (res.updated && res.updated[0] ? ITEMS.find(i => i.id === res.updated[0]) : null);
    const text = names.length ? `${names.map(i => i.name).join(', ')} 등록됨` : (res.updated && res.updated.length ? '항목을 고쳤어요' : (res.dup && res.dup.length ? '이미 있는 곳이에요' : 'PA가 처리했어요'));
    showAction(text, '보기', () => first ? viewItem(first.id) : openComposer(), 8000);
  } else if(r.status === 'question'){
    showAction('PA가 물어봐요', '보기', () => openComposer(), 8000);
  } else if(r.status === 'failed'){
    showAction('PA가 처리하지 못했어요', '보기', () => openComposer(), 8000);
  }
}

function bufToB64(buf){
  const u = new Uint8Array(buf); let s = '';
  for(let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
}
async function jpegOf(bmp, maxSide, q){
  const k = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
  return bufToB64(await blob.arrayBuffer());
}
async function prepImage(f){
  const bmp = await createImageBitmap(f);
  let data = '';
  for(const q of [0.8, 0.6, 0.45, 0.3]){ data = await jpegOf(bmp, 1600, q); if(data.length <= 950000) break; }
  if(data.length > 950000) throw new Error('too big');
  let thumb = '';
  for(const q of [0.7, 0.5, 0.35]){ thumb = await jpegOf(bmp, 256, q); if(thumb.length <= 30000) break; }
  if(bmp.close) bmp.close();
  return {data, thumb: thumb.length <= 30000 ? thumb : ''};
}
async function addFiles(files){
  for(const f of files){
    if(comp.atts.length >= 4){ toast('첨부는 4개까지예요'); break; }
    try{
      if(f.type === 'application/pdf' || /\.pdf$/i.test(f.name)){
        if(f.size > 700 * 1024){ toast('PDF는 700KB까지예요 — 해당 페이지를 캡처해서 보내 주세요'); continue; }
        comp.atts.push({kind:'pdf', name:f.name.slice(0, 100), data:bufToB64(await f.arrayBuffer()), thumb:''});
      } else if(f.type.startsWith('image/')){
        const {data, thumb} = await prepImage(f);
        comp.atts.push({kind:'image', name:(f.name || '사진').slice(0, 100), data, thumb});
      } else toast('사진과 PDF만 보낼 수 있어요');
    }catch(_){ toast(`${f.name || '파일'}을(를) 읽지 못했어요`); }
  }
  renderAtts();
}
function renderAtts(){
  $('#cprev').innerHTML = comp.atts.map((a, i) => `<div class="att">${a.kind === 'image' ? thumbImg(a.thumb) : 'PDF<br>' + esc(a.name.slice(0, 14))}<button type="button" data-rm="${i}" aria-label="빼기">${svg('close', 12)}</button></div>`).join('');
}
async function sendRequest({text, target, retryOf, atts}){
  const ref = doc(reqCol);
  const b = writeBatch(db);
  const body = {by:user.email, byName:(user.displayName || user.email).slice(0, 60), createdAt:serverTimestamp(), text:(text || '').slice(0, 4000),
                attach:atts.map(a => ({kind:a.kind, name:a.name})), thumbs:atts.map(a => a.thumb || ''), status:'queued'};
  if(target) body.targetId = target;
  if(retryOf) body.retryOf = retryOf;
  b.set(ref, body);
  atts.forEach((a, i) => b.set(doc(collection(ref, 'files'), String(i)), {kind:a.kind, data:a.data}));
  const p = b.commit();
  if(!navigator.onLine){ p.catch(err => toast(`보내지 못했어요 (${err.code || err.message})`)); return 'offline'; }
  await p;
  return 'sent';
}

/* --- 보낸 부탁 목록 --- */
function reqHtml(r){
  const st = RSTAT[r.status] || [String(r.status), 'gray'];
  const res = r.result || {};
  let rr = '';
  if(r.status === 'done'){
    const added = (res.added || []).map(id => ITEMS.find(i => i.id === id)).filter(Boolean);
    const upd = (res.updated || []).map(id => ITEMS.find(i => i.id === id)).filter(Boolean);
    const parts = [];
    if(added.length) parts.push(added.map(i => `<button class="linkbtn" data-open="${esc(i.id)}">${esc(i.name)}</button>`).join(' · ') + ' 등록');
    if(upd.length) parts.push(upd.map(i => `<button class="linkbtn" data-open="${esc(i.id)}">${esc(i.name)}</button>`).join(' · ') + ' 고침');
    if(res.dup && res.dup.length) parts.push('이미 있음: ' + res.dup.map(d => `<button class="linkbtn" data-open="${esc(d.id)}">${esc(d.name || '보기')}</button>`).join(' · '));
    if(!parts.length) parts.push('새로 넣은 곳 없음');
    rr = parts.join('<br>') + (res.note ? `<br><span class="hint">${esc(res.note)}</span>` : '');
  } else if(r.status === 'question') rr = 'PA: ' + esc(res.question || '');
  else if(r.status === 'failed') rr = esc(r.error || '처리하지 못했어요');
  else if(r.status === 'queued' && r.nextTryAt) rr = `${esc(hhmm(r.nextTryAt))}쯤 다시 시도해요`;
  const acts = [];
  if(r.status === 'queued') acts.push(`<button class="sbtn" data-cancel="${esc(r.id)}">취소</button>`);
  if(r.status === 'question') acts.push(`<button class="sbtn primary" data-more="${esc(r.id)}">사진 더 보내기</button>`);
  if(r.status === 'failed') acts.push(`<button class="sbtn" data-retry="${esc(r.id)}">다시 부탁</button>`);
  const thumbs = Array.isArray(r.thumbs) ? r.thumbs.map(thumbImg).join('') : '';
  return `<div class="req"><div class="rh"><span class="tag ${st[1]}">${st[0]}</span><span>${esc(r.byName || '')}</span><span class="tnum">${esc(hhmm(r.createdAt))}</span>${r.targetId ? '<span>· 항목 고치기</span>' : ''}${r.retryOf ? '<span>· 이어서</span>' : ''}</div>
    ${r.text ? `<div class="rt">${esc(r.text)}</div>` : ''}${thumbs ? `<div class="thumbs">${thumbs}</div>` : ''}
    ${rr ? `<div class="rr">${rr}</div>` : ''}${acts.length ? `<div class="ra">${acts.join('')}</div>` : ''}</div>`;
}
function renderReqs(){
  $('#reqlist').innerHTML = REQS.length ? REQS.map(reqHtml).join('') : '<p class="empty">아직 보낸 부탁이 없어요.</p>';
}
$('#reqlist').addEventListener('click', e => {
  const o = e.target.closest('[data-open]'); if(o){ viewItem(o.dataset.open); return; }
  const c = e.target.closest('[data-cancel]');
  if(c){ updateDoc(doc(reqCol, c.dataset.cancel), {status:'cancelled'}).then(() => toast('취소했어요')).catch(() => toast('이미 처리 중이라 취소할 수 없어요')); return; }
  const m = e.target.closest('[data-more]'); if(m){ openComposer({retryOf:m.dataset.more, text:''}); return; }
  const r = e.target.closest('[data-retry]');
  if(r){ sendRequest({text:'다시 부탁해요', retryOf:r.dataset.retry, atts:[]}).then(() => toast('다시 보냈어요')).catch(err => toast(`보내지 못했어요 (${err.code || err.message})`)); }
});

/* --- 새 후보 확인 --- */
function renderBadge(){
  const n = ITEMS.filter(needsReview).length;
  const b = $('#newbadge');
  b.hidden = !n;
  b.textContent = `새 후보 ${n}`;
  if(!$('#review').hidden) renderReview();
}
$('#newbadge').addEventListener('click', () => { $('#composer').hidden = true; renderReview(); $('#review').hidden = false; });
$('#rvclose').addEventListener('click', () => { $('#review').hidden = true; });
async function reqOf(rid){
  if(!rid || reqCache.has(rid)) return reqCache.get(rid) || null;
  reqCache.set(rid, null);
  try{ const s = await getDoc(doc(reqCol, rid)); const r = s.exists() ? {id:s.id, ...s.data()} : null; reqCache.set(rid, r); return r; }
  catch(_){ return null; }
}
function checkList(it){
  const miss = [];
  if(!it.addrLocal && !it.addrEn) miss.push('주소');
  if(!(it.closed && it.closed.length)) miss.push('쉬는 요일');
  if(!it.resv || it.resv === 'pending') miss.push('예약 여부');
  return miss;
}
function renderReview(){
  const list = ITEMS.filter(needsReview).sort((a, b) => String(b.requestId).localeCompare(String(a.requestId)));
  $('#rvtitle').textContent = `새 후보 확인 ${list.length}`;
  if(!list.length){ $('#rvbody').innerHTML = '<p class="empty">확인할 새 후보가 없어요.</p>'; return; }
  const pending = [];
  $('#rvbody').innerHTML = list.map(it => {
    const r = reqCache.get(it.requestId);
    if(it.requestId && !reqCache.has(it.requestId)) pending.push(it.requestId);
    const th = r && Array.isArray(r.thumbs) ? r.thumbs.map(thumbImg).join('') : '';
    const miss = checkList(it);
    const chk = (miss.length || /확인 필요/.test(it.memo || '')) ? `<div class="chk">확인 필요: ${esc(miss.join(', ') || '메모 참고')}</div>` : '';
    const city = CITIES.find(c => c.key === it.city);
    return `<div class="rvcard" data-id="${esc(it.id)}">${th ? `<div class="thumbs">${th}</div>` : ''}
      <h4>${esc(it.name)}</h4><p class="sub">${esc([it.local, city && city.label, typeLabel(it)].filter(Boolean).join(' · '))}</p>
      ${it.addrLocal ? `<p class="sub">${esc(it.addrLocal)}</p>` : ''}${it.memo ? `<p class="hint">${esc(it.memo)}</p>` : ''}${chk}${linksBlock(it, false)}
      <div class="qa"><button class="sbtn primary" data-rv="ok">맞아요</button><button class="sbtn" data-rv="wrong">다른 곳이에요</button><button class="sbtn" data-rv="view">지도에서 보기</button><button class="sbtn" data-rv="del">지우기</button></div></div>`;
  }).join('');
  [...new Set(pending)].forEach(rid => reqOf(rid).then(() => { if(!$('#review').hidden) renderReview(); }));
}
$('#rvbody').addEventListener('click', e => {
  const b = e.target.closest('[data-rv]'); if(!b) return;
  const id = b.closest('.rvcard').dataset.id;
  const a = b.dataset.rv;
  if(a === 'ok') patchItem(id, {reviewed:true}, '확인했어요');
  else if(a === 'wrong') openComposer({target:id, text:'이 곳이 아니에요. '});
  else if(a === 'view') viewItem(id);
  else if(a === 'del') deleteWithUndo(id);
});

/* --- 항목 쓰기 --- */
function patchItem(id, data, msg){
  return updateDoc(doc(itemsCol, id), {...data, updatedBy:user.email, updatedByName:user.displayName || user.email, updatedAt:serverTimestamp()})
    .then(() => { if(msg) toast(msg); })
    .catch(err => toast(`저장하지 못했어요 (${err.code || err.message})`));
}
function deleteWithUndo(id){
  const it = ITEMS.find(i => i.id === id); if(!it) return;
  const copy = {...it}; delete copy.id; delete copy._ll;
  deleteDoc(doc(itemsCol, id)).catch(err => toast(`지우지 못했어요 (${err.code})`));
  if(state.detail === id){ state.detail = null; renderList(); }
  showAction(`${it.name} 지움`, '되돌리기', () => setDoc(doc(itemsCol, id), copy).then(() => toast('되돌렸어요')).catch(err => toast(`되돌리지 못했어요 (${err.code})`)), 5000);
}

/* --- 상세 화면 조각 --- */
function linksBlock(it, withMaps){
  const links = (it.links || []).filter(l => safeUrl(l.u)).map(l => ({t:l.t || l.u, u:l.u}));
  if(withMaps && it.type !== 'move' && it.lnglat) links.unshift({t:'구글맵에서 보기', u:`https://www.google.com/maps/search/?api=1&query=${it.lnglat[1]},${it.lnglat[0]}`});
  return links.length ? `<div class="links">${links.map(l => `<span><a href="${esc(safeUrl(l.u))}" target="_blank" rel="noopener noreferrer">${esc(l.t)}</a><span class="dom">${esc(domainOf(l.u))}</span></span>`).join(' ')}</div>` : '';
}
function paLine(it){
  if(it.addedBy !== 'pa') return '';
  return it.reviewed === false
    ? `<div class="chk">PA가 넣은 후보 — 아직 확인 전이에요 <button class="sbtn" data-qa="ok">맞아요</button></div>`
    : '<p class="hint">PA가 넣음</p>';
}
function quickActions(it){
  const b = [];
  b.push(`<button class="sbtn" data-qa="sched">일정 정하기</button>`);
  b.push(it.status === 'confirmed' ? `<button class="sbtn" data-qa="cand">후보로</button>` : `<button class="sbtn primary" data-qa="conf">확정으로</button>`);
  if(it.type !== 'move' && it.resv !== 'done') b.push(`<button class="sbtn" data-qa="resv">예약 완료로</button>`);
  const rl = (it.links || []).find(l => safeUrl(l.u) && /예약|book|reserv/i.test(String(l.t) + l.u));
  if(rl) b.push(`<a class="sbtn" href="${esc(safeUrl(rl.u))}" target="_blank" rel="noopener noreferrer">예약 페이지 열기<span class="dom">${esc(domainOf(rl.u))}</span></a>`);
  if(it.type !== 'move' && it.lnglat) b.push(`<a class="sbtn" href="https://www.google.com/maps/dir/?api=1&destination=${it.lnglat[1]},${it.lnglat[0]}" target="_blank" rel="noopener noreferrer">길찾기</a>`);
  if(it.type !== 'move') b.push(`<button class="sbtn" data-qa="recheck">PA에게 다시 확인</button>`);
  b.push(`<button class="sbtn" data-qa="edit">직접 고치기</button>`);
  b.push(`<button class="sbtn" data-qa="del">지우기</button>`);
  return `<div class="qa">${b.join('')}</div>`;
}
function altsBlock(it){
  const alts = Array.isArray(it.alts) ? it.alts.filter(a => a && (a.name || a.local)) : [];
  if(!alts.length) return '';
  return `<div class="alts"><span class="lb">다른 후보</span>${alts.map((a, i) => `<div class="alt"><span>${esc(a.name || a.local)}${a.local && a.name ? ` <span class="hint">${esc(a.local)}</span>` : ''}</span><button class="sbtn" data-alt="${i}">이걸로 바꾸기</button></div>`).join('')}</div>`;
}
function schedHtml(it){
  const c = CITIES.find(x => x.key === it.city);
  let days = c ? DAYS.filter(d => d >= c.from && d <= c.to) : DAYS.slice();
  if(!days.length) days = DAYS.slice();
  if(it.type === 'stay'){
    const all = [...DAYS, trip && trip.end].filter(Boolean);
    return `<div class="sched"><span class="lb">체크인 → 체크아웃 순서로 누르세요</span><div class="chips">${all.map(d => `<button class="chip" data-sday="${d}" aria-pressed="${d === sched.date || d === sched.end}">${md(d)}</button>`).join('')}</div><div><button class="sbtn primary" data-qa="schedsave">저장</button></div></div>`;
  }
  const closed = new Set(it.closed || []);
  return `<div class="sched"><span class="lb">날짜${closed.size ? ' (쉬는 날은 누를 수 없어요)' : ''}</span><div class="chips">${days.map(d => `<button class="chip" data-sday="${d}" ${closed.has(wday(d)) ? 'disabled title="쉬는 날"' : ''} aria-pressed="${sched.date === d}">${md(d)}</button>`).join('')}<button class="chip" data-sday="" aria-pressed="${!sched.date}">미정</button></div>
    <span class="lb">때</span><div class="chips">${SLOTS.map(([l, t]) => `<button class="chip" data-stime="${t}" aria-pressed="${sched.time === t}">${l}</button>`).join('')}<button class="chip" data-stime="" aria-pressed="${!sched.time}">미정</button></div>
    <div><button class="sbtn primary" data-qa="schedsave">저장</button></div></div>`;
}
$('#pbody').addEventListener('click', e => {
  const id = state.detail; if(!id) return;
  const it = ITEMS.find(i => i.id === id); if(!it) return;
  const q = e.target.closest('[data-qa]');
  const sd = e.target.closest('[data-sday]');
  const stt = e.target.closest('[data-stime]');
  const al = e.target.closest('[data-alt]');
  if(sd && sched){
    const d = sd.dataset.sday || null;
    if(it.type === 'stay'){ if(!sched.date || sched.end || (d && d <= sched.date)){ sched.date = d; sched.end = null; } else sched.end = d; }
    else sched.date = d;
    $('#schedbox').innerHTML = schedHtml(it); return;
  }
  if(stt && sched){ sched.time = stt.dataset.stime || null; $('#schedbox').innerHTML = schedHtml(it); return; }
  if(al){
    const a = (it.alts || [])[Number(al.dataset.alt)]; if(!a) return;
    sendRequest({text:`이 후보로 바꿔줘: ${a.local || a.name}${a.place ? ' (' + a.place + ')' : ''}`, target:id, atts:[]}).then(() => toast('PA에게 바꿔 달라고 보냈어요')).catch(err => toast(`보내지 못했어요 (${err.code || err.message})`));
    return;
  }
  if(!q) return;
  const a = q.dataset.qa;
  if(a === 'sched'){ sched = {date:it.date || null, end:it.end || null, time:it.time || null}; $('#schedbox').innerHTML = schedHtml(it); setSheet('fit'); }
  else if(a === 'schedsave'){
    if(it.type === 'stay'){ if(!sched.date || !sched.end){ toast('체크인과 체크아웃을 모두 골라 주세요'); return; } patchItem(id, {date:sched.date, end:sched.end}, '일정을 정했어요'); }
    else patchItem(id, {date:sched.date, time:sched.time}, '일정을 정했어요');
    sched = null;
  }
  else if(a === 'conf') patchItem(id, {status:'confirmed', reviewed:true}, '확정했어요');
  else if(a === 'cand') patchItem(id, {status:'candidate'}, '후보로 돌렸어요');
  else if(a === 'resv') patchItem(id, {resv:'done'}, '예약 완료로 바꿨어요');
  else if(a === 'ok') patchItem(id, {reviewed:true}, '확인했어요');
  else if(a === 'recheck') openComposer({target:id, text:''});
  else if(a === 'edit'){ go('info'); openForm(id); }
  else if(a === 'del') deleteWithUndo(id);
});

/* --- 설치형 앱 · 안드로이드 공유 --- */
function idbTake(){
  return new Promise(resolve => {
    let req;
    try{ req = indexedDB.open('hm-share', 1); }catch(_){ resolve(null); return; }
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onerror = () => resolve(null);
    req.onsuccess = () => {
      const tx = req.result.transaction('kv', 'readwrite'), st = tx.objectStore('kv');
      const g = st.get('share');
      g.onsuccess = () => { st.delete('share'); resolve(g.result || null); };
      g.onerror = () => resolve(null);
    };
  });
}
async function grabShare(){
  if(!/[?&]share=1/.test(location.search)) return;
  history.replaceState(null, '', location.pathname + location.hash);
  const data = await idbTake();
  if(!data) return;
  const files = (data.files || []).slice(0, 4).map(f => new File([f.buf], f.name || 'shared', {type:f.type || ''}));
  pendingShare = {text:[data.title, data.text, data.url].filter(Boolean).join('\n'), files};
  consumeShare();
}
async function consumeShare(){
  if(!pendingShare || !user || !itemsLoaded) return;
  const p = pendingShare; pendingShare = null;
  comp.atts = [];
  openComposer({text:p.text});
  await addFiles(p.files);
}
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js', {scope:'./'}).catch(() => {});
grabShare();

$('#cadd-ic').innerHTML = svg('add');

$('#rvclose').innerHTML = svg('close', 20);

$('#back').innerHTML = svg('chevron--left', 20);
$('#dclose').innerHTML = svg('close', 20);
$('#lg-close').innerHTML = svg('close');
$('#lg-open-ic').innerHTML = svg('list');
$('#add-ic').innerHTML = svg('add');

renderLegend();
show(location.hash.slice(1) || 'map');
